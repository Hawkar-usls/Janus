name: CHRONO-DNA R9A node A
on:
  push:
    branches: [research/chrono-dna-r9-node-a]
    paths:
      - 'research/chrono_dna_r9/pilot.py'
      - '.github/workflows/chrono-dna-r9a.yml'
permissions:
  contents: read
concurrency:
  group: chrono-r9a-A
  cancel-in-progress: false
jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python research/chrono_dna_r9/pilot.py sync A
  audit:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: research/chrono-dna-r9-node-a
          persist-credentials: false
      - run: python research/chrono_dna_r9/pilot.py audit A
