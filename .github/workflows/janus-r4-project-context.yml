name: JANUS R4 read-only project context
on:
  pull_request:
    paths:
      - 'autonomy/registry/project_context_r4.py'
      - '.github/workflows/janus-r4-project-context.yml'
  push:
    branches: [research/r4-registry-state-reader-20261124]
    paths:
      - 'autonomy/registry/project_context_r4.py'
      - '.github/workflows/janus-r4-project-context.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-project-context:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: e85c19c31bdad729f06961d64de36d8f3a620483
          path: pinned-r4-meta
          persist-credentials: false
          sparse-checkout: |
            data/JANUS-CHAT-CONTEXT-INDEX.json
            data/JANUS-COSMOS-SETI-CURRENT-STATE.json
            data/JANUS-COSMOS-SETI-DEVELOPMENT-JOURNAL.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/Janus-Fundamentum
          ref: 941148371aac0a503d4f254c839683642fdf2f20
          path: pinned-r4-fund
          persist-credentials: false
          sparse-checkout: |
            registry/TRUMP_CURRENT_STATE.json
            docs/TRUMP_DEVELOPMENT_JOURNAL.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Local negative controls and actual pinned source replay
        run: |
          set -euo pipefail
          python autonomy/registry/project_context_r4.py --self-test
          for project in COSMOS_SETI TRUMP; do
            python autonomy/registry/project_context_r4.py --meta-root pinned-r4-meta --fund-root pinned-r4-fund --project "$project" > "$RUNNER_TEMP/$project.json"
          done
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          c = json.loads((root/"COSMOS_SETI.json").read_text())
          t = json.loads((root/"TRUMP.json").read_text())
          for x in (c,t):
              assert x["action_authority"] is False
              assert x["live_state_verified"] is False
              assert x["production_writeback"] is False
          d = c["untrusted_recorded_data"]
          assert d["journal_event_count"] == 241
          assert d["stage_candidates_differ"] is True
          assert d["stage_candidates"]["journal_last_listed_event"] == "R42A4B"
          assert t["untrusted_recorded_data"]["recorded_historical_failure"] == "FAIL_NO_TRANSFER_RULE"
          print("R4 PINNED PROJECT CONTEXT REPLAY PASS; LIVE AUTHORITY HOLD")
          print(json.dumps(d["stage_candidates"], sort_keys=True))
          PY
