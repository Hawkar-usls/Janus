name: Tranception Rowan evidence and SDK checks
on:
  push:
    paths:
      - 'integrations/tranception_rowan/**'
      - '.github/workflows/tranception-rowan-check.yml'
      - '.github/workflows/rowan-*.yml'
  pull_request:
    paths:
      - 'integrations/tranception_rowan/**'
      - '.github/workflows/tranception-rowan-check.yml'
      - '.github/workflows/rowan-*.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install pure numeric geometry test dependency (no Rowan credentials)
        run: python -m pip install --disable-pip-version-check --quiet 'numpy>=2,<3'
      - name: Run no-provider-calls provenance and safety tests
        run: |
          python -m compileall -q integrations/tranception_rowan/probe.py
          python -m unittest discover -s integrations/tranception_rowan/tests -v
          python -m json.tool integrations/tranception_rowan/discovery_manifest.json > /dev/null
          python -m compileall -q integrations/tranception_rowan/assay_distribution.py
          python -m compileall -q integrations/tranception_rowan/dms_evidence.py
          python integrations/tranception_rowan/probe.py --arm wildtype --output "${RUNNER_TEMP}/tranception-wt-plan.json"
          python integrations/tranception_rowan/probe.py --arm K5A --output "${RUNNER_TEMP}/tranception-mut-plan.json"
  sdk-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install public Rowan Python v3 only, no API credentials
        run: python -m pip install 'rowan-python>=3,<4'
      - name: Verify protein cofolding SDK signatures without submitting
        run: |
          python - <<'PY'
          import inspect
          import rowan
          assert hasattr(rowan, "ProteinCofoldingResult")
          assert hasattr(rowan, "CofoldingModel")
          assert hasattr(rowan.CofoldingModel, "BOLTZ_2")
          assert hasattr(rowan, "whoami")
          sig = inspect.signature(rowan.submit_protein_cofolding_workflow)
          for arg in ("initial_protein_sequences", "model", "num_samples", "use_msa_server", "max_credits", "is_draft"):
              assert arg in sig.parameters, arg
          assert "result_type" in inspect.signature(rowan.retrieve_workflow).parameters
          print("TRANCEPTION_ROWAN_SDK_SURFACE=PASS")
          PY

  public-assay-check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate published source bytes against frozen public SHA
        run: |
          python integrations/tranception_rowan/dms_evidence.py \
            --download-pinned-public-assay \
            --output "${RUNNER_TEMP}/bbc1-k5a-assay-evidence.json"
      - name: Show only provenance status (not fabricated assay values)
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"]) / "bbc1-k5a-assay-evidence.json"
          r=json.loads(p.read_text(encoding="utf-8"))
          print("ASSAY_HASH=PINNED_SHA256_VERIFIED")
          print("K5A_ROW_STATUS=" + r["status"])
          if r["processed_row"] is not None:
              print("K5A_PROCESSED_ASSAY_LABEL=" + repr(r["processed_row"]["processed_label"]))
              print("K5A_BENCHMARK_FOLD_ID=" + str(r["processed_row"]["fold_id"]))
          print("ASSAY_LABEL_REPLICATES_VERIFIED=" + str(r["biological_replicates_verified"]))
          PY
      - name: Preserve immutable public-assay provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: bbc1-k5a-dms-provenance-${{ github.run_id }}
          path: ${{ runner.temp }}/bbc1-k5a-assay-evidence.json
          retention-days: 7
          if-no-files-found: error

  population-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Independently download and audit the full SHA-pinned public BBC1 assay
        run: |
          python integrations/tranception_rowan/assay_distribution.py \
            --output "${RUNNER_TEMP}/bbc1-assay-population.json"
      - name: Verify evidence status and avoid provider claims
        env:
          AUDIT_FILE: ${{ runner.temp }}/bbc1-assay-population.json
        run: |
          python - <<'PY'
          import os,json
          d=json.load(open(os.environ["AUDIT_FILE"],encoding="utf-8"))
          assert d["K5A"]["rank_ascending"] >= 1
          assert d["rowan_model_prediction"]=="NOT_RUN"
          assert d["tranception_model_prediction"]=="NOT_RUN"
          assert d["row_count"]==d["unique_sequence_count"]
          print("BBC1_ASSAY_POPULATION_INTEGRITY=PASS")
          PY
      - name: Publish pinned public descriptive report as CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: bbc1-full-public-assay-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/bbc1-assay-population.json
          retention-days: 7
          if-no-files-found: error

  historical-tranception-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Re-read official pinned Git blob containing published Tranception BBC1 benchmark
        run: |
          python integrations/tranception_rowan/published_tranception_baseline.py \
            --output "${RUNNER_TEMP}/bbc1-published-tranception.json"
      - name: Assert publication values, not new Tranception execution
        env:
          RECEIPT: ${{ runner.temp }}/bbc1-published-tranception.json
        run: |
          python - <<'PY'
          import os,json
          r=json.load(open(os.environ["RECEIPT"],encoding="utf-8"))
          assert r["number_of_mutants_reported_in_official_benchmark"] == 2069
          assert r["spearman_rho"]["Tranception L"] == 0.365
          assert r["spearman_rho"]["Tranception L no retrieval"] == 0.299
          assert r["model_weights_executed_by_janus"] is False
          assert r["rowan_computation_executed"] is False
          print("OFFICIAL_TRANCEPTION_BBC1_BASELINE=VERIFIED_PRECOMPUTED_ONLY")
          PY
      - name: Save machine-readable upstream performance provenance
        uses: actions/upload-artifact@v4
        with:
          name: tranception-bbc1-published-baseline-${{ github.run_id }}
          path: ${{ runner.temp }}/bbc1-published-tranception.json
          retention-days: 7
          if-no-files-found: error

  retrieval-paired-official:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce published retrieval-vs-no-retrieval on official pinned ProteinGym Git blob
        run: |
          python integrations/tranception_rowan/retrieval_paired_audit.py --output "${RUNNER_TEMP}/tranception-retrieval-paired.json"
      - name: Verify source scope and non-execution evidence boundary
        env:
          RECEIPT: ${{ runner.temp }}/tranception-retrieval-paired.json
        run: |
          python - <<'PY'
          import json,os
          with open(os.environ["RECEIPT"],encoding="utf-8") as f:
              r=json.load(f)
          assert r["population"]["total_assays"] >= 200
          assert r["comparisons"]["L_PRIMARY"]["n_proteins"] >= 100
          assert r["model_weights_rerun"] is False
          assert r["rowan_job_uuid"] is None
          assert r["bbc1_delta_rho"]["L_PRIMARY"] > 0.06
          print("TRANCEPTION_PROTEIN_CLUSTERED_PAIR_GATE=PASS")
          PY
      - name: Save provenance-aware model ablation reanalysis receipt
        uses: actions/upload-artifact@v4
        with:
          name: tranception-protein-clustered-retrieval-${{ github.run_id }}
          path: ${{ runner.temp }}/tranception-retrieval-paired.json
          retention-days: 7
          if-no-files-found: error

  pilot-source-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate pinned 1084-row source and freeze eight eligible mutant identities
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,"integrations/tranception_rowan")
          from dms_evidence import get_pinned_dataset
          from rowan_bbc1_s2_pilot import select
          p=Path("integrations/tranception_rowan")
          manifest=json.loads((p/"discovery_manifest.json").read_text(encoding="utf-8"))
          chosen=select(get_pinned_dataset(),manifest)
          assert len(chosen)==8
          assert len(set(x["position_1_based"] for x in chosen))==8
          for x in chosen:
              print("PILOT_PREREG="+str(x["quantile_target_percent"])+":"+x["mutation"])
          print("PILOT_PINNED_PUBLIC_MUTANT_SELECTION=PASS")
          PY
