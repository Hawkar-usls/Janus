name: JANUS R84H22 neural mastery
on:
  pull_request:
    types: [opened]
    paths:
      - 'autonomy/federation/r84h22_mastery.py'
      - '.github/workflows/r84h22-mastery.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: r84h22-bounded-research
  cancel-in-progress: false
jobs:
  train:
    if: github.repository == 'Hawkar-usls/Janus' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r84h22-neural-mastery-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            autonomy/federation/r84h22_mastery.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: r84h21-trained
          path: ${{ runner.temp }}/h21
          run-id: 45779176546
          github-token: ${{ github.token }}
      - run: |
          test ! -e autonomy/federation/R84H22_FROZEN_GRAPH_EXAM.json
          python autonomy/federation/r84h22_mastery.py train "$RUNNER_TEMP/h21" "$RUNNER_TEMP/trained"
      - uses: actions/upload-artifact@v4
        with:
          name: r84h22-trained
          path: ${{ runner.temp }}/trained
          if-no-files-found: error
          retention-days: 60
  exam:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: r84h21-trained
          path: ${{ runner.temp }}/h21
          run-id: 45779176546
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h22-trained
          path: ${{ runner.temp }}/trained
      - run: python autonomy/federation/r84h22_mastery.py evaluate "$RUNNER_TEMP/h21" "$RUNNER_TEMP/trained" "$RUNNER_TEMP/exam"
      - uses: actions/upload-artifact@v4
        with:
          name: r84h22-exam
          path: ${{ runner.temp }}/exam
          if-no-files-found: error
          retention-days: 60
  history:
    if: github.repository == 'Hawkar-usls/Janus' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r84h22-neural-mastery-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
      - uses: actions/download-artifact@v4
        with:
          name: r84e-prepared
          path: ${{ runner.temp }}/prepared
          run-id: 45678170449
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h7-cycle5
          path: ${{ runner.temp }}/root
          run-id: 45702441451
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h8-cycle3
          path: ${{ runner.temp }}/bundle
          run-id: 45704306939
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h10-trained
          path: ${{ runner.temp }}/resonance
          run-id: 45706296802
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h11-trained
          path: ${{ runner.temp }}/cortex
          run-id: 45707256292
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h12-trained
          path: ${{ runner.temp }}/evolution
          run-id: 45708640174
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h17-results
          path: ${{ runner.temp }}/h17
          run-id: 45714097493
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h16-world-100000
          path: ${{ runner.temp }}/snapshot
          run-id: 45712978294
          github-token: ${{ github.token }}
      - run: python autonomy/federation/r84h22_mastery.py historical "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/root" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/resonance" "$RUNNER_TEMP/cortex" "$RUNNER_TEMP/evolution" "$RUNNER_TEMP/h17" "$RUNNER_TEMP/snapshot" "$RUNNER_TEMP/history"
      - uses: actions/upload-artifact@v4
        with:
          name: r84h22-history
          path: ${{ runner.temp }}/history
          if-no-files-found: error
          retention-days: 60
  summary:
    needs: [exam, history]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: r84h22-exam
          path: ${{ runner.temp }}/exam
      - uses: actions/download-artifact@v4
        with:
          name: r84h22-history
          path: ${{ runner.temp }}/history
      - uses: actions/download-artifact@v4
        with:
          name: r84h22-trained
          path: ${{ runner.temp }}/trained
      - run: python autonomy/federation/r84h22_mastery.py summarize "$RUNNER_TEMP/exam" "$RUNNER_TEMP/history" "$RUNNER_TEMP/trained" "$RUNNER_TEMP/summary"
      - uses: actions/upload-artifact@v4
        with:
          name: r84h22-summary
          path: ${{ runner.temp }}/summary
          if-no-files-found: error
          retention-days: 60
