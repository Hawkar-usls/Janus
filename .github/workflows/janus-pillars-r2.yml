name: JANUS R2 Pillars and Evolution Research

on:
  pull_request:
    paths:
      - 'autonomy/pillars/**'
      - 'tests/test_autonomy_pillars.py'
      - 'tests/test_autonomy_pillars_fitness.py'
      - '.github/workflows/janus-pillars-r2.yml'
      - 'docs/JANUS_PILLARS_R2.md'
  push:
    branches: [research/pillars-r2-github-native-20261124]
    paths:
      - 'autonomy/pillars/**'
      - 'tests/test_autonomy_pillars.py'
      - 'tests/test_autonomy_pillars_fitness.py'
      - '.github/workflows/janus-pillars-r2.yml'
      - 'docs/JANUS_PILLARS_R2.md'
  workflow_dispatch:
  schedule:
    - cron: '19 5 * * *'
permissions:
  contents: read
concurrency:
  group: janus-r2-pillars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Exact external source pins, health and no-fork/no-promotion invariants
        run: |
          set -euo pipefail
          python -m py_compile autonomy/pillars/*.py
          python -m unittest discover -s tests -p 'test_autonomy_pillars.py' -v
          python -m unittest discover -s tests -p 'test_autonomy_pillars_fitness.py' -v
          python -m unittest discover -s tests -p 'test_autonomy_admission.py' -v
          python -m unittest discover -s tests -p 'test_autonomy_health.py' -v

  produce-plan:
    needs: offline-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 9306037335bb4532049633b7f5f082e75891ff51
          path: pinned-registry
          sparse-checkout: |
            data/autonomy_map/receipts/45219142499-health.json
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Derive top four inert modules from recorded health HOLD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pillars"
          python -m autonomy.pillars.engine \
            --health pinned-registry/data/autonomy_map/receipts/45219142499-health.json \
            --out "$RUNNER_TEMP/pillars/PLAN.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"pillars/PLAN.json").read_text())
          assert len(x["selected_blueprints"])==4
          assert x["health_triage"]["status"]=="HEALTH_HOLD_TRIAGED_NOT_REPAIRED"
          assert x["external_admission"]=="HOLD_NOT_OBTAINED"
          assert not x["action_authority"]
          print("JANUS_PILLARS_R2__FOUR_PROPOSALS__NO_EXECUTION_OR_FORK")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janus-r2-pillar-plan
          path: ${{ runner.temp }}/pillars/PLAN.json
          if-no-files-found: error
          retention-days: 30

  separate-plan-verifier:
    needs: produce-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: janus-r2-pillar-plan
          path: plan
      - name: Separate parser checks ranking, provenance, gene chain and HOLD
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pillars"
          python -m autonomy.pillars.verifier \
            --plan plan/PLAN.json --catalog autonomy/pillars/CATALOG.json \
            --needs autonomy/pillars/NEEDS.json --policy autonomy/policy.json \
            --out "$RUNNER_TEMP/pillars/VERIFIER.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"pillars/VERIFIER.json").read_text())
          assert x["status"]=="OFFLINE_PLAN_STRUCTURALLY_CONSISTENT__ADMISSION_HOLD"
          assert not x["may_activate_organs"] and not x["may_fork_external_code"]
          assert not x["external_witness_attested"]
          print("JANUS_R2_SEPARATE_CODEPATH__NO_EXTERNAL_AUTHORITY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janus-r2-pillar-verifier
          path: ${{ runner.temp }}/pillars/VERIFIER.json
          if-no-files-found: error
          retention-days: 30

  public-source-watch:
    needs: offline-contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Observe 13 public sources by GET HEAD/metadata, never clone or run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pillars"
          python -m autonomy.pillars.upstream_watch --out "$RUNNER_TEMP/pillars/WATCH.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"pillars/WATCH.json").read_text())
          assert x["public_repositories_checked"]==13
          assert x["requests_used"]<=26
          assert x["forks_created"]==0
          assert not x["license_bytes_verified"] and not x["auto_promoted"]
          print("JANUS_R2_PUBLIC_SOURCE_DRIFT_PROBE__NO_FOREIGN_CODE")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janus-r2-public-source-watch
          path: ${{ runner.temp }}/pillars/WATCH.json
          if-no-files-found: error
          retention-days: 30
