name: MCP Gateway

on:
  pull_request:
    paths:
      - "mcp_gateway/**"
      - "organism/**"
      - "docs/JANUS_MCP_GATEWAY.md"
      - "docs/JANUS_SPIRAL_TRANCEPTION.md"
      - "docs/JANUS_CODEX_CLOUD_AND_CHATGPT_GATEWAY.md"
      - ".janus/MCP_GATEWAY_LINK.json"
      - ".github/workflows/mcp-gateway.yml"
  push:
    branches:
      - main
    paths:
      - "mcp_gateway/**"
      - "organism/**"
      - "docs/JANUS_MCP_GATEWAY.md"
      - "docs/JANUS_SPIRAL_TRANCEPTION.md"
      - "docs/JANUS_CODEX_CLOUD_AND_CHATGPT_GATEWAY.md"
      - ".janus/MCP_GATEWAY_LINK.json"
      - ".github/workflows/mcp-gateway.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MCP SDK
        run: python -m pip install -r mcp_gateway/requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s mcp_gateway/tests -v
      - name: Parse organism JSON
        run: python -c "import json,pathlib; [json.loads(p.read_text(encoding='utf-8')) for p in pathlib.Path('organism').glob('*.json')]; print('organism-json-ok')"
      - name: Compile
        run: python -m compileall -q mcp_gateway
      - name: MCP import smoke
        run: python -c "from mcp_gateway.server import mcp; print(type(mcp).__name__)"
