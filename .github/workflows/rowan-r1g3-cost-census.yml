name: JANUS Rowan R1G3 existing public cost census
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: janus-rowan-science-submit-and-collect
  cancel-in-progress: false
jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: rowan-research
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s integrations/tranception_rowan/tests -p 'test_rowan_r1g3_cost_census.py' -v
      - run: python -m pip install --disable-pip-version-check --quiet 'rowan-python==3.2.3' 'stjames==0.0.289'
      - name: Read existing public control metadata only
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
          R1G3_RECEIPT: ${{ runner.temp }}/r1g3-cost-census.json
        run: python integrations/tranception_rowan/rowan_r1g3_cost_census.py
      - uses: actions/upload-artifact@v4
        with:
          name: r1g3-cost-census-${{ github.run_id }}
          path: ${{ runner.temp }}/r1g3-cost-census.json
          retention-days: 14
