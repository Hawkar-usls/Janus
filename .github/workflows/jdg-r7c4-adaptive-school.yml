name: JDG R7C4 Adaptive School
on:
  pull_request:
    paths:
      - 'autonomy/federation/jdg_r7c4.py'
      - '.github/workflows/jdg-r7c4-adaptive-school.yml'
permissions:
  contents: read
jobs:
  curriculum:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      key_sha: ${{ steps.worker.outputs.key_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run source-pinned native-error profile, Beetle director and adaptive curriculum
        id: worker
        run: |
          mkdir -p "$RUNNER_TEMP/jdg-home"
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP/jdg-home" LANG=C.UTF-8 \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_OUTPUT="$GITHUB_OUTPUT" \
            python3 autonomy/federation/jdg_r7c4.py worker "$RUNNER_TEMP/jdg-curriculum"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdg-r7c4-adaptive
          path: ${{ runner.temp }}/jdg-curriculum/
          if-no-files-found: error
          retention-days: 30
  verify:
    needs: curriculum
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: jdg-r7c4-adaptive
          path: ${{ runner.temp }}/jdg-curriculum
      - name: Verify real error provenance, route, curriculum arithmetic and signature
        env:
          KEY_SHA: ${{ needs.curriculum.outputs.key_sha }}
        run: python3 autonomy/federation/jdg_r7c4.py verify "$RUNNER_TEMP/jdg-curriculum" "$KEY_SHA"
