name: JANUS R84H14 bounded HLOD sprite partition
on:
  pull_request:
    types: [opened]
    paths:
      - 'autonomy/federation/r84h14_partition.py'
      - '.github/workflows/r84h14-partition.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: r84h14-bounded-research
  cancel-in-progress: false
jobs:
  evaluate:
    if: github.repository == 'Hawkar-usls/Janus' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r84h14-world-partition-20261126' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4 scipy==1.13.1
      - uses: actions/download-artifact@v4
        with:
          name: r84e-prepared
          path: ${{ runner.temp }}/prepared
          run-id: 45678170449
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h7-cycle5
          path: ${{ runner.temp }}/root
          run-id: 45702441451
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h8-cycle3
          path: ${{ runner.temp }}/bundle
          run-id: 45704306939
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h10-trained
          path: ${{ runner.temp }}/resonance
          run-id: 45706296802
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h11-trained
          path: ${{ runner.temp }}/cortex
          run-id: 45707256292
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: r84h12-trained
          path: ${{ runner.temp }}/evolution
          run-id: 45708640174
          github-token: ${{ github.token }}
      - run: python autonomy/federation/r84h14_partition.py "$RUNNER_TEMP/prepared" "$RUNNER_TEMP/root" "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/resonance" "$RUNNER_TEMP/cortex" "$RUNNER_TEMP/evolution" "$RUNNER_TEMP/results"
      - uses: actions/upload-artifact@v4
        with:
          name: r84h14-results
          path: ${{ runner.temp }}/results
          if-no-files-found: error
          retention-days: 60
