name: JANUS R3 Meta Registry Public JSON Schema Explorer

on:
  push:
    branches: [research/r3-organ-self-repair-diagnostic-20261124]
    paths:
      - 'autonomy/registry/schema_indexer.py'
      - 'autonomy/registry/navigator.py'
      - 'tests/test_autonomy_r3_schema_explorer.py'
      - '.github/workflows/janus-r3-registry-schema-explorer.yml'
  pull_request:
    paths:
      - 'autonomy/registry/schema_indexer.py'
      - 'autonomy/registry/navigator.py'
      - 'tests/test_autonomy_r3_schema_explorer.py'
      - '.github/workflows/janus-r3-registry-schema-explorer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-pinned-public-registry-json:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 07f5e4115d88b7df4081135d27eda2878874aa9c
          path: pinned-meta-data
          sparse-checkout: |
            data
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run adversarial schema/index safety tests without network calls
        working-directory: _candidate
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_autonomy_r3_schema_explorer.py' -v
      - name: Read all available public JSON paths; parse bounded schema information only
        working-directory: _candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r3-schema"
          python -m autonomy.registry.schema_indexer \
            --root ../pinned-meta-data \
            --source-commit "$(git -C ../pinned-meta-data rev-parse HEAD)" \
            --out "$RUNNER_TEMP/r3-schema/SCHEMA_CATALOG.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/'r3-schema/SCHEMA_CATALOG.json').read_text())
          assert x['source_commit_sha']=='07f5e4115d88b7df4081135d27eda2878874aa9c'
          assert x['discovered_data_json_paths'] >= 4000
          assert x['readable_schema_object_json'] > 0
          assert x['source_file_writes'] is False
          assert x['source_text_executed'] is False
          assert x['automatic_project_admission'] is False
          assert x['all_schema_files_trusted'] is False
          assert x['automatic_fork_or_module_birth'] is False
          print('JANUS_META_JSON_DISCOVERY_PASS__UNKNOWN_OR_PARTIAL_SCHEMA_HOLD')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janus-r3-public-meta-registry-schema-catalog
          path: ${{ runner.temp }}/r3-schema/SCHEMA_CATALOG.json
          if-no-files-found: error
          retention-days: 30
