          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check numpy==1.26.4 safetensors==0.5.2
          python -c 'import importlib.util; assert importlib.util.find_spec("transformers") is None; assert importlib.util.find_spec("huggingface_hub") is None'
      - uses: actions/download-artifact@v4
        with:
          name: r84h38h-trained
          run-id: 45836412459
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/h38h
      - uses: actions/download-artifact@v4
        with:
          name: r84h38i-trained
          run-id: 45837224743
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/h38i
      - uses: actions/download-artifact@v4
        with:
          name: r84h38l-trained
          run-id: 45840549500
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/lparent
      - uses: actions/download-artifact@v4
        with:
          name: r84h38n-trained
          run-id: 45843328260
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/nparent
      - uses: actions/download-artifact@v4
        with:
          name: r84h38n1-factor
          run-id: 45844137619
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/factor
      - uses: actions/download-artifact@v4
        with:
          name: r84h38n2-repair
          run-id: 45845651569
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - uses: actions/download-artifact@v4
        with:
          name: r84h38n3-preflight
          path: ${{ runner.temp }}/pre
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 7afe55feecd75555ff265955788dc426249bfecf
          path: registry
          sparse-checkout: |
            data/JANUS-DEEP-ANALYSIS-5D-SPIRAL-ORIGIN-PRIME-ORACLE-PROTOCOL-2026-08-21-v2.1.json
            data/JANUS-R84-H38N2-NEURAL-SYMBIOSIS-EXECUTION-2026-11-26-v1.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - run: |
          test ! -e autonomy/federation/R84H38N3_FROZEN_EXAM.json
          test ! -e autonomy/federation/R84H38N2_FROZEN_EXAM.json
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- env JANUS_PARENT_NETNS="$(readlink /proc/self/ns/net)" "$(command -v python)" autonomy/federation/r84h38n3_adaptive_repair.py train "$RUNNER_TEMP/h38h" "$RUNNER_TEMP/h38i" "$RUNNER_TEMP/lparent" "$RUNNER_TEMP/nparent" "$RUNNER_TEMP/factor" "$RUNNER_TEMP/pre/preflight.json" "$RUNNER_TEMP/prior" registry/data/JANUS-R84-H38N2-NEURAL-SYMBIOSIS-EXECUTION-2026-11-26-v1.json registry/data/JANUS-DEEP-ANALYSIS-5D-SPIRAL-ORIGIN-PRIME-ORACLE-PROTOCOL-2026-08-21-v2.1.json "$RUNNER_TEMP/repair"
      - uses: actions/upload-artifact@v4
        with:
          name: r84h38n3-repair
          path: ${{ runner.temp }}/repair
          if-no-files-found: error
          retention-days: 60
  scout:
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-lapis
          ref: f6a30b41fca4ce1dc636909e2c4c14b29891cbaf
          path: lapis
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - uses: actions/download-artifact@v4
        with:
          name: r84h38n3-repair
          path: ${{ runner.temp }}/repair
      - run: |
          python - <<'PY'
          import json, os, sys, hashlib
          from pathlib import Path
          p=Path(os.environ["RUNNER_TEMP"]);q=json.loads((p/"repair/gap_request.json").read_text());m=json.loads((p/"repair/error_memory.json").read_text())
          digest=m.pop("sha256")
          assert hashlib.sha256(json.dumps(m,sort_keys=True,separators=(",",":")).encode()).hexdigest()==digest==q["memory_sha"]
          terms=q["terms"];assert set(terms)=={"semantic role labeling","relation extraction","contrastive learning","word order"} and q["failed_slots"]==["direction"]
          sys.path.insert(0,str(Path("lapis/tools").resolve()))
          import universal_beetle as b
          root=p/"beetle";state=b.State(root)
          cfg={"schema":"janus.universal_beetle.directions.v1","global_budget":{"max_requests_per_run":2,"max_new_candidates_per_run":12,"max_metadata_bytes_per_run":1000000},"directions":[{"id":"h38n3_direction_repair","title":"Direction and representation repair","keywords":terms,"priority_keywords":terms,"min_score":1,"sources":[{"kind":"arxiv","query":" OR ".join('all:"'+t+'"' for t in terms),"max_results":6},{"kind":"zenodo","query":" OR ".join('"'+t+'"' for t in terms),"max_results":6}]}]}
          summary=b.run_scout(cfg,state,None)
          rec={"schema":"h38n3.beetle.v1","gap":q,"summary":summary,"beetle_commit":"f6a30b41fca4ce1dc636909e2c4c14b29891cbaf","training_allowed":False,"production":False}
          (root/"H38N3_SCOUT.json").write_text(json.dumps(rec,sort_keys=True)+"\n")
          print("R84H38N3_BEETLE",json.dumps(rec,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r84h38n3-beetle
          path: ${{ runner.temp }}/beetle
          if-no-files-found: error
          retention-days: 60
