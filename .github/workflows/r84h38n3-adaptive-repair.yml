          persist-credentials: false
          sparse-checkout: |
            autonomy/federation/r84h38n3_adaptive_repair.py
            autonomy/federation/r84h38n2_neural_symbiosis.py
            autonomy/federation/r84h38n1_semantic_recovery.py
            autonomy/federation/r84h38n_semantic_correction.py
            autonomy/federation/r84h38m_knowledge_diversification.py
            autonomy/federation/r84h38l_knowledge_crystallization.py
            autonomy/federation/r84h38j_fractal_self_learning.py
            autonomy/federation/r84h38i_fractal_reconstruction.py
            autonomy/federation/r84h38h_semantic_kaleidoscope.py
            autonomy/federation/r84h38g_semantic_mosaic.py
            autonomy/federation/r84h38f_semantic_crystal.py
            autonomy/federation/r84h38e_semantic_invariance.py
