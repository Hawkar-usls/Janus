name: Trait Immune System R2

on:
  push:
    branches:
      - security/trait-immune-system-r2
  pull_request:
    paths:
      - 'trait_immune_system.py'
      - 'tests/test_trait_immune_system.py'
      - '.github/workflows/trait-immune-system-r2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile trait_immune_system.py
      - name: Unit tests
        run: python -m unittest tests.test_trait_immune_system -v
