name: JANUS R5 Registry Intelligence (bounded CPU)
on:
  pull_request:
    paths:
      - 'autonomy/registry/registry_intelligence_r5.py'
      - 'autonomy/registry/R5_FROZEN_INTERNAL_EXAM.json'
      - '.github/workflows/janus-r5-registry-intelligence.yml'
  push:
    branches: [research/r5-registry-intelligence-20261124]
    paths:
      - 'autonomy/registry/registry_intelligence_r5.py'
      - '.github/workflows/janus-r5-registry-intelligence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-intelligence-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: e85c19c31bdad729f06961d64de36d8f3a620483
          path: pinned-r5-meta
          persist-credentials: false
          sparse-checkout: |
            data/JANUS-CHAT-CONTEXT-INDEX.json
            data/JANUS-COSMOS-SETI-CURRENT-STATE.json
            data/JANUS-COSMOS-SETI-DEVELOPMENT-JOURNAL.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/Janus-Fundamentum
          ref: 941148371aac0a503d4f254c839683642fdf2f20
          path: pinned-r5-fund
          persist-credentials: false
          sparse-checkout: |
            registry/TRUMP_CURRENT_STATE.json
            docs/TRUMP_DEVELOPMENT_JOURNAL.md
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/janus-lapis
          ref: f6a30b41fca4ce1dc636909e2c4c14b29891cbaf
          path: pinned-r5-beetle
          persist-credentials: false
          sparse-checkout: |
            data/beetle/directions.json
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 00910a3e1ea2d50650c20308ab66e3c2f7be46ab
          path: pinned-r5-demi
          persist-credentials: false
          sparse-checkout: |
            janus_model/__init__.py
            janus_model/memory_cortex_growth.py
            janus_model/memory_512_audit_index_r3.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Train on real source fields and evaluate frozen internal exam
        env:
          PYTHONPATH: ${{ github.workspace }}/pinned-r5-demi
        run: |
          set -euo pipefail
          python autonomy/registry/project_context_r4.py --self-test
          python autonomy/registry/registry_intelligence_r5.py --meta pinned-r5-meta --fund pinned-r5-fund --beetle pinned-r5-beetle --demi pinned-r5-demi --exam autonomy/registry/R5_FROZEN_INTERNAL_EXAM.json --out "$RUNNER_TEMP/r5-registry"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"r5-registry"
          x=json.loads((root/"R5_RESULT.json").read_text())
          assert x["train_examples"]==17 and x["exam_cases"]==20
          assert x["production_promotion"] is False and x["external_exam"] is False
          assert x["memory_cortex"]["production_state_written"] is False
          assert x["beetle"]["dispatched"] is False
          print(json.dumps(x,ensure_ascii=False,sort_keys=True))
          PY
