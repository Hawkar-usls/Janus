name: JANUS R3 Meta Registry Live Freshness Witness

on:
  push:
    branches: [research/r3-organ-self-repair-diagnostic-20261124]
    paths:
      - 'autonomy/registry/live_freshness.py'
      - 'autonomy/registry/navigator.py'
      - 'tests/test_autonomy_r3_live_freshness.py'
      - '.github/workflows/janus-r3-registry-live-freshness.yml'
  pull_request:
    paths:
      - 'autonomy/registry/live_freshness.py'
      - 'autonomy/registry/navigator.py'
      - 'tests/test_autonomy_r3_live_freshness.py'
      - '.github/workflows/janus-r3-registry-live-freshness.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  read-only-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Anti-fake main/index freshness and zero-authority tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_autonomy_r3_live_freshness.py' -v
      - name: Observe public Meta Registry main HEAD and canonical index SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/janus-r3"
          python -m autonomy.registry.live_freshness --out "$RUNNER_TEMP/janus-r3/LIVE_FRESHNESS.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"janus-r3/LIVE_FRESHNESS.json").read_text())
          assert x["api_get_calls_completed"]<=2
          assert x["source_file_writes"] is False if "source_file_writes" in x else True
          assert x["main_index_may_be_automatically_rewritten"] is False
          assert x["full_organism_current_state_validated"] is False
          assert x["p03_admission_granted"] is False
          assert x["external_review_completed"] is False
          print("JANUS_R3_LIVE_FRESHNESS_ONLY__NO_UPGRADE_OR_AUTHORITY")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janus-r3-live-meta-freshness
          path: ${{ runner.temp }}/janus-r3/LIVE_FRESHNESS.json
          if-no-files-found: error
          retention-days: 30
