name: JANUS R84H retrospective growth equilibrium audit
on:
  pull_request:
    types: [opened]
    paths:
      - 'autonomy/federation/r84h_growth_audit.py'
      - '.github/workflows/r84h-growth-audit.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    if: github.repository == 'Hawkar-usls/Janus' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'research/r84h-growth-equilibrium-20261125' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: r84g2-results
          run-id: 45688517804
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source
      - run: python3 autonomy/federation/r84h_growth_audit.py "$RUNNER_TEMP/source/result.json" "$RUNNER_TEMP/audit"
      - uses: actions/upload-artifact@v4
        with:
          name: r84h-growth-audit
          path: ${{ runner.temp }}/audit
          if-no-files-found: error
          retention-days: 60
