name: JANUS Rowan R1G bounded cross-protein sample panel
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [collect, submit]
        default: collect
        required: true
      authorize_weekly_credit_spend:
        type: choice
        options: ["NO", "YES"]
        default: "NO"
        required: true
permissions:
  contents: read
concurrency:
  group: janus-rowan-science-submit-and-collect
  cancel-in-progress: false
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    environment:
      name: rowan-research
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline panel boundary tests
        run: python -m unittest discover -s integrations/tranception_rowan/tests -p 'test_rowan_r1g_panel.py' -v
      - name: Install pinned SDK
        run: python -m pip install --disable-pip-version-check --quiet 'rowan-python==3.2.3' 'stjames==0.0.289'
      - name: One sequential frozen panel
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
          R1G_ACTION: ${{ inputs.action }}
          R1G_APPROVED: ${{ inputs.action == 'submit' && inputs.authorize_weekly_credit_spend == 'YES' && 'TRUE' || 'FALSE' }}
          R1G_RECEIPT: ${{ runner.temp }}/rowan-r1g.json
        run: python integrations/tranception_rowan/rowan_r1g_panel.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rowan-r1g-${{ github.run_id }}
          path: ${{ runner.temp }}/rowan-r1g.json
          if-no-files-found: ignore
          retention-days: 14
