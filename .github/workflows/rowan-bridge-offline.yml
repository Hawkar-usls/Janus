name: Rowan bridge offline tests
on:
  push:
    paths:
      - "integrations/rowan/**"
      - ".github/workflows/rowan-bridge-offline.yml"
  pull_request:
    paths:
      - "integrations/rowan/**"
      - ".github/workflows/rowan-bridge-offline.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate with Python built-ins only
        run: |
          python -m compileall -q integrations/rowan/janus_rowan_bridge.py
          python -m unittest discover -s integrations/rowan/tests -v
          python -m json.tool integrations/rowan/research_case_v1.schema.json > /dev/null
          python -m json.tool integrations/rowan/examples/phenol_case.json > /dev/null
      - name: Confirm absence of remote Rowan executions in CI
        run: |
          test -z "${ROWAN_API_KEY:-}"
