name: R7.0D balanced teacher distillation
on:
  pull_request:
    paths:
      - 'autonomy/registry/assimilation_r70d.py'
      - 'research/assimilation/R70D_TRAIN.json'
      - 'research/assimilation/R70D_EXAM.json'
      - '.github/workflows/janus-r70d-balanced-learning.yml'
permissions:
  contents: read
  actions: read
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      seal: ${{ steps.seal.outputs.receipt }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            autonomy/registry/assimilation_r70b.py
            autonomy/registry/assimilation_r70c.py
            autonomy/registry/assimilation_r70d.py
            research/assimilation/R70D_TRAIN.json
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 2c0fe086fe26d766e6df62f932d1df88bba0ab22
          path: pool
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/JANUS-COSMOS-SETI-R21-WEAK-SIGNAL-TEMPLATE-2026-11-17.json
            data/JANUS-COSMOS-SETI-R24-ODONTO-CRYSTAL-GROWTH-2026-11-17.json
            data/JANUS-COSMOS-SETI-R25-FUNDAMENTUM-BOUNDARY-MATCHING-2026-11-17.json
            data/JANUS-COSMOS-SETI-R26-WEAKNESS-DIAGNOSTIC-2026-11-17.json
            data/JANUS-COSMOS-SETI-R26C-ON-OFF-REFERENCE-ALIGNMENT-2026-11-17.json
            data/JANUS-COSMOS-SETI-R27-EXTERNAL-BENCHMARK-2026-11-17.json
            data/JANUS-COSMOS-SETI-R28-HYBRID-DETECTOR-2026-11-17.json
            data/JANUS-COSMOS-SETI-R28B-ADAPTIVE-ROUTER-2026-11-18.json
            data/JANUS-COSMOS-SETI-R29-STAR-FORGE-2026-11-18.json
            data/JANUS-COSMOS-SETI-R30-FALSE-ALARM-SHIELD-2026-11-18.json
            data/JANUS-COSMOS-SETI-R30C-HANNAH-RFI-MEMORY-2026-11-18.json
            data/JANUS-COSMOS-SETI-R31-HANNAH-PROSPECTIVE-2026-11-18.json
            data/JANUS-COSMOS-SETI-R32-HANNAH-ADAPTIVE-2026-11-18.json
            data/JANUS-COSMOS-SETI-R33-HANNAH-VERIFIED-FAMILIES-2026-11-18.json
            data/JANUS-COSMOS-SETI-R33B2-HANNAH-DRIFT-REPLAY-2026-11-18.json
            data/JANUS-COSMOS-SETI-R33B4-SOURCE-IDENTITY-2026-11-18.json
            data/JANUS-COSMOS-SETI-R33BCD-HANNAH-CATALOG-2026-11-18.json
            data/JANUS-COSMOS-SETI-R35-GRAND-BENCHMARK-2026-11-18.json
            data/JANUS-COSMOS-SETI-R36-GALAXY-SWARM-2026-11-18.json
            data/JANUS-COSMOS-SETI-R37A-HANNAH-RESOLUTION-2026-11-18.json
            data/JANUS-COSMOS-SETI-R40B-TRANSFER-2026-11-18.json
            data/JANUS-COSMOS-SETI-R40CDE-TRANSFER-2026-11-18.json
            data/JANUS-COSMOS-SETI-R40H-FROZEN-TRANSFER-2026-11-18.json
            data/JANUS-COSMOS-SETI-R40M-ADVERSARIAL-SHIELD-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N-RAW-RIVALS-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N1-CROSSDAY-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N10-ARTMONEY-TURBO-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N10B-EXPANSION-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N2-INSTRUMENT-CONTROLS-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N3-CROSSDAY-KUSTO-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N4-NEIGHBORHOOD-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N5-MATCHED-FREQUENCY-2026-11-19.json
            data/JANUS-COSMOS-SETI-R40N5A-VERIFIED-FREQUENCY-2026-11-19.json
            data/JANUS-COSMOS-SETI-R41A-PRUNING-2026-11-19.json
            data/JANUS-TACHYON-DEMIHEAD-R5-PAIRED-GAIN-2026-11-22.json
            data/JANUS-TACHYON-SIMPTOMAT-R3-INDEPENDENT-DATA-QUALIFICATION-2026-11-22.json
            data/JANUS-TOPA-SPIDER-SIRIUS-CRT-0222-CROSS-LINEAGE-RUN-2026-09-01-v1.0.json
            data/JANUS-TRUMP-EXACT-CHANNEL-DECOMPOSITION-APPLICATION-CONTRACT-2026-09-20-v1.6.json
            data/JANUS-TRUMP-MINIMAL-SPLIT-STATE-REQUIREMENTS-RESULT-2026-09-20-v1.0.json
            data/JANUS-WEDJAT-MUSEUM-GEOMETRY-PROTOCOL-2026-08-15-v0.1.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Read exact previous candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Hawkar-usls/Janus/actions/artifacts/14950931857/zip > "$RUNNER_TEMP/r70c.zip"
          echo "15272209de2d1b9aee63b00428f9aba8357ab0371b9af213f2b49d500c5ec52e  $RUNNER_TEMP/r70c.zip" | sha256sum -c -
      - run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Train without reading fresh or regression exam
        run: python autonomy/registry/assimilation_r70d.py train "$RUNNER_TEMP/r70c.zip" "$RUNNER_TEMP/CANDIDATE.json"
      - name: Freeze candidate receipt
        id: seal
        run: python -c 'import json,os; print("receipt="+json.load(open(os.environ["RUNNER_TEMP"]+"/CANDIDATE.json"))["receipt_sha256"])' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: r70d-frozen-candidate
          path: ${{ runner.temp }}/CANDIDATE.json
          retention-days: 30
  exam:
    needs: train
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            autonomy/registry/assimilation_r70b.py
            autonomy/registry/assimilation_r70c.py
            autonomy/registry/assimilation_r70d.py
            research/assimilation/R70D_TRAIN.json
            research/assimilation/R70D_EXAM.json
            research/assimilation/R70C_EXAM.json
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 2c0fe086fe26d766e6df62f932d1df88bba0ab22
          path: fresh
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/JANUS-COSMOS-SETI-R41S1H3-RETINA-CLOCK-INTERMOD-2026-11-21.json
            data/JANUS-COSMOS-SETI-R42A6-SIGNAL-PRESERVATION-2026-11-21.json
            data/JANUS-TACHYON-SIMPTOMAT-R2B-INDEPENDENT-METHODS-REVIEW-2026-11-22.json
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 9b04f146b386d215fede6eb5d53bdb5de600bcc1
          path: exam651
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/JANUS-MEMORY-CORTEX-RELIABILITY-REPAIR-2026-11-23-v2.json
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 6aa8ded5f7e31112bc9ff94a13f9521bfa7de438
          path: exam652
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/JANUS-ESSENCE-G9-FUNCTIONAL-RECOVERY-2026-11-23.json
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: d9d74d2e16b743afa796063e31f34ad07ca1099d
          path: exam654
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            data/JANUS-TRINITY-PARENTAL-CPU-R11-R12-2026-11-23.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Read exact previous candidate artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Hawkar-usls/Janus/actions/artifacts/14950931857/zip > "$RUNNER_TEMP/r70c.zip"
          echo "15272209de2d1b9aee63b00428f9aba8357ab0371b9af213f2b49d500c5ec52e  $RUNNER_TEMP/r70c.zip" | sha256sum -c -
      - run: python -m pip install --disable-pip-version-check --no-cache-dir torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: r70d-frozen-candidate
          path: ${{ runner.temp }}/candidate
      - name: Fresh first look and separate disclosed regression audit
        env:
          EXPECTED_SEAL: ${{ needs.train.outputs.seal }}
        run: python autonomy/registry/assimilation_r70d.py exam "$RUNNER_TEMP/r70c.zip" "$RUNNER_TEMP/candidate/CANDIDATE.json" "$EXPECTED_SEAL"
