name: JANUS Rowan R1 source-pinned cloud pair
on:
  workflow_dispatch:
    inputs:
      role:
        type: choice
        options: [WT, T8A]
        default: WT
        required: true
      action:
        type: choice
        options: [collect, submit]
        default: collect
        required: true
      authorize_weekly_credit_spend:
        type: choice
        options: ["NO", "YES"]
        default: "NO"
        required: true
permissions:
  contents: read
concurrency:
  group: janus-rowan-science-submit-and-collect
  cancel-in-progress: false
jobs:
  one-case:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: rowan-research
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: offline tests
        run: python -m unittest discover -s integrations/tranception_rowan/tests -p 'test_rowan_r1_cloud_pair.py' -v
      - name: Install pinned SDK
        run: python -m pip install --disable-pip-version-check --quiet 'rowan-python==3.2.3' 'stjames==0.0.289'
      - name: Perform one explicit operation
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
          R1_ROLE: ${{ inputs.role }}
          R1_ACTION: ${{ inputs.action }}
          R1_APPROVED: ${{ inputs.action == 'submit' && inputs.authorize_weekly_credit_spend == 'YES' && 'TRUE' || 'FALSE' }}
          R1_RECEIPT: ${{ runner.temp }}/rowan-r1-cloud-pair.json
        run: python integrations/tranception_rowan/rowan_r1_cloud_pair.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rowan-r1-cloud-pair-${{ github.run_id }}
          path: ${{ runner.temp }}/rowan-r1-cloud-pair.json
          if-no-files-found: ignore
          retention-days: 14
