name: JANUS R3 Registry-Native Self-Repair (Read-Only Research)

on:
  push:
    branches: [research/r3-organ-self-repair-diagnostic-20261124]
    paths: ['autonomy/repair/**', 'autonomy/registry/**', 'autonomy/pillars/engine.py', 'tests/test_autonomy_r3_*.py', '.github/workflows/janus-r3-registry-self-repair.yml']
  pull_request:
    paths: ['autonomy/repair/**', 'autonomy/registry/**', 'autonomy/pillars/engine.py', 'tests/test_autonomy_r3_*.py', '.github/workflows/janus-r3-registry-self-repair.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: _candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hawkar-usls/Janus
          ref: 376fdc5fe16b36071136290cec715724b21ffe86
          path: _parent
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 07f5e4115d88b7df4081135d27eda2878874aa9c
          path: pinned-meta-main
          sparse-checkout: |
            data/JANUS-CHAT-CONTEXT-INDEX.json
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Hawkar-usls/janus-meta-registry
          ref: 9306037335bb4532049633b7f5f082e75891ff51
          path: pinned-meta-map
          sparse-checkout: |
            data/autonomy_map/CURRENT_STATE.json
            data/autonomy_map/OPERATING_CONTRACT.json
            data/autonomy_map/receipts/45219142499-health.json
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Test registry map and preregistered repair against old parent
        working-directory: _candidate
        env:
          JANUS_R3_MAIN_ROOT: ../pinned-meta-main
          JANUS_R3_MAP_ROOT: ../pinned-meta-map
          JANUS_R3_REQUIRE_PINNED_REGISTRY: '1'
        run: |
          set -euo pipefail
          python -m py_compile autonomy/registry/navigator.py autonomy/repair/doctor.py tests/test_autonomy_r3_registry.py tests/test_autonomy_r3_repair.py
          python -m unittest discover -s tests -p 'test_autonomy_r3_*.py' -v
          python -m unittest discover -s tests -p 'test_autonomy_pillars.py' -v
          python -m unittest discover -s tests -p 'test_autonomy_pillars_fitness.py' -v
          python -m unittest discover -s tests -p 'test_autonomy_admission.py' -v
          python -m unittest discover -s tests -p 'test_autonomy_health.py' -v
      - name: Resolve real pinned Meta Registry JSON
        working-directory: _candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/janus-r3"
          python -m autonomy.registry.navigator \
            --main-root ../pinned-meta-main --map-root ../pinned-meta-map \
            --main-commit "$(git -C ../pinned-meta-main rev-parse HEAD)" \
            --map-commit "$(git -C ../pinned-meta-map rev-parse HEAD)" \
            --project JANUS --out "$RUNNER_TEMP/janus-r3/BOOT_CONTEXT.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ["RUNNER_TEMP"])/"janus-r3/BOOT_CONTEXT.json").read_text())
          assert x["historical_repositories_observed"]==49
          assert x["historical_health_observation_gate"]=="HOLD"
          assert len(x["next_review_gates"])==7
          assert not x["capability_limits"]["production_writeback"]
          print("JANUS_R3_REGISTRY_BOOTSTRAP_PASS__AUTONOMY_HOLD")
          PY
      - name: Reproduce missing diagnostics and generate reversible proposal
        working-directory: _candidate
        run: |
          set -euo pipefail
          python -m autonomy.repair.doctor \
            --health ../pinned-meta-map/data/autonomy_map/receipts/45219142499-health.json \
            --baseline ../_parent/autonomy/pillars/engine.py \
            --candidate autonomy/pillars/engine.py \
            --exam autonomy/repair/R3_FROZEN_NEW_CASES.json \
            --out "$RUNNER_TEMP/janus-r3/REPAIR_PROPOSAL.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ["RUNNER_TEMP"])/"janus-r3/REPAIR_PROPOSAL.json").read_text())
          q=p["paired_evaluation"]
          assert p["status"]=="FIRST_PARTY_DIAGNOSTIC_PATCH_PAIRED_PASS__REVIEW_ONLY"
          assert q["candidate_correct"]==24 and q["parent_correct"]==15
          assert q["lost_parent_correct"]==0
          assert p["diagnosis"]["unclassified_total"]==5
          assert not p["constraints"]["auto_merge"]
          assert not p["constraints"]["production_activated"]
          print("JANUS_R3_PROPOSED_REPAIR_PAIRED_PASS__PR_REVIEW_REQUIRED")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: janus-r3-boot-and-first-repair
          path: |
            ${{ runner.temp }}/janus-r3/BOOT_CONTEXT.json
            ${{ runner.temp }}/janus-r3/REPAIR_PROPOSAL.json
          if-no-files-found: error
          retention-days: 30
