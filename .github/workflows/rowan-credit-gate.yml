name: JANUS Rowan Credit Gate
on:
  workflow_dispatch:
  schedule:
    - cron: '47 2 * * 0'

permissions:
  contents: read

concurrency:
  group: janus-rowan-budget-gate
  cancel-in-progress: false

jobs:
  credit-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: rowan-research
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned provider SDK
        run: python -m pip install --disable-pip-version-check --quiet 'rowan-python==3.2.3'
      - name: Read bounded balance bands, no provider writes
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
        run: python integrations/tranception_rowan/budget_gate.py
