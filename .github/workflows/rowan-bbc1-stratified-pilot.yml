name: JANUS Rowan BBC1 Stratified Pilot S2

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Collect only (no Rowan submit) or preregistered weekly-credit submission'
        type: choice
        required: true
        default: collect_only
        options:
          - collect_only
          - submit_and_collect
  schedule:
    # One previously approved spend-gated submission opportunity each day.
    - cron: '17 7 * * *'
    # Free provider-status reads only, spaced ahead of the hourly Meta Registry archivist.
    # 04:09 is the last collector before the 07:17 daily submission ACK gate.
    - cron: '9 0,4,8,12,16,20 * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: janus-rowan-science-submit-and-collect
  cancel-in-progress: false

jobs:
  eight-mutant-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: rowan-research
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rowan SDK
        run: python -m pip install --disable-pip-version-check --quiet 'rowan-python==3.2.3'
      - name: Freeze completed eight-case S2 before any Rowan submit or ACK step
        id: completion
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '17 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit_and_collect') }}
        run: python integrations/tranception_rowan/rowan_s2_completion_freeze.py
      - name: Require durable Meta Registry ACK for previous completed pilot run
        if: ${{ ((github.event_name == 'schedule' && github.event.schedule == '17 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit_and_collect')) && steps.completion.outputs.should_submit == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python integrations/tranception_rowan/rowan_meta_ack_gate.py
      - name: Execute at most one frozen mutant with weekly credits only
        if: ${{ ((github.event_name == 'schedule' && github.event.schedule == '17 7 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit_and_collect')) && steps.completion.outputs.should_submit == 'true' }}
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
          JANUS_ROWAN_S2_APPROVED: 'TRUE'
        run: python integrations/tranception_rowan/rowan_bbc1_s2_pilot.py
      - name: Read progress and matched experimental labels without spending
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
          JANUS_ROWAN_S2_RECEIPT: ${{ runner.temp }}/bbc1-eight-mutant-pilot.json
        run: python integrations/tranception_rowan/rowan_bbc1_s2_collect.py
      - name: Retain public-safe, processed-assay-only pilot report
        uses: actions/upload-artifact@v4
        with:
          name: bbc1-pilot-eight-public-safe-${{ github.run_id }}
          path: ${{ runner.temp }}/bbc1-eight-mutant-pilot.json
          retention-days: 14
          if-no-files-found: error
