name: JANUS Rowan FN1 exact UniProt domain pose zero credits
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-rowan-science-submit-and-collect
  cancel-in-progress: false

jobs:
  posthoc-exploratory-domain-pose-only:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: rowan-research
      deployment: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen read-only structural analysis packages
        run: python -m pip install --disable-pip-version-check --quiet 'rowan-python==3.2.3' 'biopython==1.85' 'numpy<3'
      - name: Validate domain/pose methods and no provider submission
        run: python -m unittest discover -v -s integrations/tranception_rowan -p 'test_rowan_fn1_uniprot_domain_pose_readonly.py'
      - name: Compare old Rowan predicted chain to 21 exact-source NMR models
        env:
          ROWAN_API_KEY: ${{ secrets.ROWAN_API_KEY }}
          JANUS_FN1_DOMAIN_RECEIPT: ${{ runner.temp }}/rowan-fn1-domain-pose-no-spend.json
        run: python integrations/tranception_rowan/rowan_fn1_uniprot_domain_pose_readonly.py
      - name: Preserve exact exploratory result (never biological or producer claim)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: janus-rowan-fn1-uniprot-domain-21-models-${{ github.run_id }}
          path: ${{ runner.temp }}/rowan-fn1-domain-pose-no-spend.json
          retention-days: 14
          if-no-files-found: error
