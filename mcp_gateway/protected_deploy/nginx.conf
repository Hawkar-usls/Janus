# JANUS MCP: TLS + Basic Auth + per-IP limits. Use only behind authorized
# ingress; a real certificate and bcrypt .htpasswd are required.
events { worker_connections 256; }
http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    limit_req_zone $binary_remote_addr zone=janus_req:10m rate=12r/m;
    limit_conn_zone $binary_remote_addr zone=janus_conn:10m;
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;

        client_max_body_size 64k;
        client_body_timeout 10s;
        send_timeout 120s;
        limit_req zone=janus_req burst=3 nodelay;
        limit_conn janus_conn 2;

        auth_basic "JANUS authorized MCP access";
        auth_basic_user_file /etc/nginx/auth/users.htpasswd;

        location = /mcp {
            proxy_pass http://janus-mcp:8000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_read_timeout 120s;
        }
        location = /mcp/ {
            proxy_pass http://janus-mcp:8000/mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Authorization "";
            proxy_buffering off;
            proxy_read_timeout 120s;
        }
        location / {
            return 404;
        }
    }
}
